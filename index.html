<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>맞춤예복 골격진단 — 디바인핸즈 전주점</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream: #F8F5F0;
    --ivory: #F0EBE3;
    --dark: #1A1714;
    --mid: #5C5650;
    --muted: #A09890;
    --border: rgba(26,23,20,0.12);
    --sans: 'Noto Sans KR', sans-serif;
    --serif: 'Noto Serif KR', serif;
  }

  html, body {
    min-height: 100%;
    background: var(--cream);
    font-family: var(--sans);
    color: var(--dark);
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* 상단바 */
  .top-bar {
    width: 100%;
    padding: 18px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 0.5px solid var(--border);
    background: var(--cream);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .brand-wrap { display: flex; flex-direction: column; gap: 2px; }
  .brand-main {
    font-family: var(--serif);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.06em;
    color: var(--dark);
  }
  .brand-sub {
    font-size: 10px;
    color: var(--muted);
    font-weight: 300;
    letter-spacing: 0.08em;
  }
  .q-counter {
    font-size: 12px;
    color: var(--muted);
    font-weight: 300;
    letter-spacing: 0.05em;
  }

  .progress-track { width: 100%; height: 2px; background: var(--border); }
  .progress-fill {
    height: 2px;
    background: var(--dark);
    transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
  }

  .main {
    width: 100%;
    max-width: 480px;
    padding: 44px 24px 80px;
    min-height: calc(100vh - 64px);
    display: flex;
    flex-direction: column;
  }

  /* 인트로 */
  .intro-screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    animation: fadeUp 0.6s ease both;
  }
  .intro-eyebrow {
    font-size: 10px;
    letter-spacing: 0.18em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 18px;
  }
  .intro-title {
    font-family: var(--serif);
    font-size: 26px;
    font-weight: 600;
    line-height: 1.45;
    color: var(--dark);
    margin-bottom: 18px;
  }
  .intro-desc {
    font-size: 14px;
    color: var(--mid);
    line-height: 1.9;
    font-weight: 300;
    margin-bottom: 8px;
  }
  .intro-notice {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.7;
    font-weight: 300;
    margin-bottom: 36px;
    padding: 12px 14px;
    border-left: 2px solid var(--border);
    background: var(--ivory);
  }
  .intro-meta {
    display: flex;
    gap: 20px;
    margin-bottom: 40px;
    padding-bottom: 32px;
    border-bottom: 0.5px solid var(--border);
  }
  .meta-item { display: flex; flex-direction: column; gap: 4px; }
  .meta-label { font-size: 10px; color: var(--muted); letter-spacing: 0.06em; }
  .meta-value { font-size: 14px; font-weight: 500; color: var(--dark); }

  .btn-start {
    display: block;
    width: 100%;
    padding: 16px;
    background: var(--dark);
    color: var(--cream);
    border: none;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .btn-start:hover { opacity: 0.82; }

  /* 퀴즈 */
  .quiz-screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    animation: fadeUp 0.4s ease both;
  }
  .q-number {
    font-size: 10px;
    letter-spacing: 0.14em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 14px;
    font-weight: 300;
  }
  .q-text {
    font-family: var(--serif);
    font-size: 20px;
    font-weight: 600;
    line-height: 1.55;
    color: var(--dark);
    margin-bottom: 8px;
  }
  .q-hint {
    font-size: 12px;
    color: var(--muted);
    font-weight: 300;
    margin-bottom: 28px;
    line-height: 1.6;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 9px;
    flex: 1;
    margin-bottom: 28px;
  }
  .opt {
    padding: 16px 18px;
    border: 0.5px solid var(--border);
    background: white;
    cursor: pointer;
    display: flex;
    align-items: flex-start;
    gap: 14px;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
    text-align: left;
  }
  .opt::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 0;
    background: var(--dark);
    transition: width 0.25s cubic-bezier(0.4,0,0.2,1);
  }
  .opt:hover { border-color: rgba(26,23,20,0.28); }
  .opt.selected { border-color: var(--dark); }
  .opt.selected::before { width: 3px; }

  .opt-key {
    font-size: 10px;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: 0.08em;
    width: 14px;
    flex-shrink: 0;
    padding-top: 3px;
    transition: color 0.2s;
  }
  .opt.selected .opt-key { color: var(--dark); }
  .opt-text {
    font-size: 14px;
    color: var(--dark);
    line-height: 1.65;
    font-weight: 300;
  }

  .nav { display: flex; gap: 10px; }
  .btn-back {
    padding: 13px 18px;
    border: 0.5px solid var(--border);
    background: transparent;
    font-family: var(--sans);
    font-size: 13px;
    color: var(--mid);
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-back:hover { border-color: var(--dark); color: var(--dark); }
  .btn-next {
    flex: 1;
    padding: 13px;
    background: var(--dark);
    color: var(--cream);
    border: none;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.2s;
    letter-spacing: 0.03em;
  }
  .btn-next:disabled { opacity: 0.22; cursor: default; }
  .btn-next:not(:disabled):hover { opacity: 0.82; }

  /* 결과 */
  .result-screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    animation: fadeUp 0.5s ease both;
  }
  .result-eyebrow {
    font-size: 10px;
    letter-spacing: 0.18em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .result-badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 500;
    padding: 5px 14px;
    letter-spacing: 0.06em;
    margin-bottom: 14px;
    border: 0.5px solid var(--dark);
    color: var(--dark);
  }
  .result-title {
    font-family: var(--serif);
    font-size: 24px;
    font-weight: 600;
    line-height: 1.35;
    color: var(--dark);
    margin-bottom: 12px;
  }
  .result-desc {
    font-size: 14px;
    color: var(--mid);
    line-height: 1.9;
    margin-bottom: 28px;
    font-weight: 300;
  }

  .result-divider {
    width: 100%;
    height: 0.5px;
    background: var(--border);
    margin-bottom: 28px;
  }

  .section-label {
    font-size: 10px;
    letter-spacing: 0.12em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  .feature-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 28px;
  }
  .feature-card {
    background: var(--ivory);
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .feature-card-label {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.06em;
    font-weight: 400;
  }
  .feature-card-value {
    font-size: 13px;
    color: var(--dark);
    font-weight: 500;
    line-height: 1.5;
  }

  .style-list {
    list-style: none;
    margin-bottom: 28px;
  }
  .style-item {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 13px 0;
    border-bottom: 0.5px solid var(--border);
  }
  .style-item:first-child { border-top: 0.5px solid var(--border); }
  .style-num {
    font-size: 10px;
    color: var(--muted);
    font-weight: 300;
    padding-top: 3px;
    width: 16px;
    flex-shrink: 0;
  }
  .style-text {
    font-size: 14px;
    color: var(--dark);
    line-height: 1.65;
    font-weight: 300;
  }

  .warn-box {
    background: var(--ivory);
    padding: 16px 18px;
    margin-bottom: 28px;
  }
  .warn-label {
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .warn-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    font-size: 13px;
    color: var(--mid);
    line-height: 1.65;
    font-weight: 300;
    margin-bottom: 6px;
  }
  .warn-item:last-child { margin-bottom: 0; }
  .warn-dash { color: var(--muted); flex-shrink: 0; }

  .cta-block {
    background: var(--dark);
    padding: 26px 22px;
    margin-bottom: 12px;
  }
  .cta-title {
    font-family: var(--serif);
    font-size: 16px;
    font-weight: 600;
    color: var(--cream);
    margin-bottom: 6px;
  }
  .cta-sub {
    font-size: 13px;
    color: rgba(248,245,240,0.55);
    line-height: 1.7;
    margin-bottom: 18px;
    font-weight: 300;
  }
  .cta-btn {
    display: block;
    width: 100%;
    padding: 13px;
    background: var(--cream);
    color: var(--dark);
    border: none;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    letter-spacing: 0.03em;
    text-align: center;
    text-decoration: none;
    transition: opacity 0.2s;
  }
  .cta-btn:hover { opacity: 0.85; }

  .btn-retry {
    display: block;
    width: 100%;
    padding: 13px;
    background: transparent;
    border: 0.5px solid var(--border);
    font-family: var(--sans);
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.03em;
    margin-bottom: 28px;
  }
  .btn-retry:hover { border-color: var(--dark); color: var(--dark); }

  .footer-note {
    font-size: 11px;
    color: var(--muted);
    font-weight: 300;
    text-align: center;
    line-height: 1.7;
    padding-top: 20px;
    border-top: 0.5px solid var(--border);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="top-bar">
  <div class="brand-wrap">
    <div class="brand-main">DIVINE HANDS</div>
    <div class="brand-sub">전주점 — 맞춤예복</div>
  </div>
  <div class="q-counter" id="counter"></div>
</div>
<div class="progress-track">
  <div class="progress-fill" id="progress" style="width:0%"></div>
</div>

<div class="main">

  <!-- 인트로 -->
  <div class="intro-screen" id="intro">
    <div class="intro-eyebrow">Body Frame Diagnosis</div>
    <h1 class="intro-title">맞춤예복<br>골격진단</h1>
    <p class="intro-desc">
      골격 유형을 알면 예복의 핏이 달라집니다.<br>
      나의 골격에 맞는 예복 스타일을 찾아드려요.
    </p>
    <div class="intro-notice">
      골격진단은 체중·키와 무관하게 타고난 뼈대와 근육 발달 방식을 기준으로 합니다. 살이 찌거나 빠져도 골격 유형은 변하지 않아요.
    </div>
    <div class="intro-meta">
      <div class="meta-item">
        <span class="meta-label">소요시간</span>
        <span class="meta-value">약 2분</span>
      </div>
      <div class="meta-item">
        <span class="meta-label">질문 수</span>
        <span class="meta-value">7개</span>
      </div>
      <div class="meta-item">
        <span class="meta-label">골격 유형</span>
        <span class="meta-value">3가지</span>
      </div>
    </div>
    <button class="btn-start" onclick="startQuiz()">진단 시작하기</button>
  </div>

  <!-- 퀴즈 -->
  <div class="quiz-screen hidden" id="quiz">
    <div class="q-number" id="qnum"></div>
    <div class="q-text" id="qtext"></div>
    <div class="q-hint" id="qhint"></div>
    <div class="options" id="opts"></div>
    <div class="nav">
      <button class="btn-back" id="back-btn" onclick="goBack()">이전</button>
      <button class="btn-next" id="next-btn" disabled onclick="goNext()">다음</button>
    </div>
  </div>

  <!-- 결과 -->
  <div class="result-screen hidden" id="result"></div>

</div>

<script>
const questions = [
  {
    q: "어깨 형태가 어떤 편인가요?",
    hint: "거울 앞에서 확인하거나, 주변에 물어보셔도 좋아요.",
    opts: [
      { text: "어깨가 넓고 각이 진 편이에요 (직각에 가까운 어깨선)", type: "S" },
      { text: "어깨가 좁고 둥근 편이에요 (경사진 느낌)", type: "W" },
      { text: "어깨뼈가 튀어나오거나 어깨선이 뚜렷하게 보여요", type: "N" }
    ]
  },
  {
    q: "쇄골과 목 라인이 어떤 편인가요?",
    hint: "쇄골이 선명하게 보이는지, 목이 길고 짧은지를 기준으로 선택해 주세요.",
    opts: [
      { text: "쇄골이 잘 드러나지 않고 목이 짧은 편이에요", type: "S" },
      { text: "쇄골이 선명하게 드러나고 목이 비교적 긴 편이에요", type: "W" },
      { text: "쇄골뼈가 굵고 두드러지며 목도 긴 편이에요", type: "N" }
    ]
  },
  {
    q: "손목과 손 마디가 어떤 편인가요?",
    hint: "손목에 힘을 빼고 자연스럽게 내려다봤을 때를 기준으로 해주세요.",
    opts: [
      { text: "손목이 가늘고 손 마디가 잘 드러나지 않아요", type: "S" },
      { text: "손목이 가는 편이고 손이 전체적으로 부드러워 보여요", type: "W" },
      { text: "손목이 굵고 손 마디가 뚜렷하게 보여요", type: "N" }
    ]
  },
  {
    q: "상체 라인 (가슴~허리)이 어떤 편인가요?",
    hint: "정면에서 봤을 때 상체의 두께감과 입체감을 기준으로 선택해 주세요.",
    opts: [
      { text: "상체가 두껍고 입체적이에요. 가슴과 허리의 거리가 짧은 느낌이에요", type: "S" },
      { text: "상체가 얇고 평면적이에요. 골격보다 부드러운 인상이에요", type: "W" },
      { text: "상체가 크고 골격감이 있어요. 어깨에 비해 허리가 잘 안 들어와요", type: "N" }
    ]
  },
  {
    q: "하체 라인이 어떤 편인가요?",
    hint: "허벅지와 무릎 아래의 라인 차이를 떠올려 보세요.",
    opts: [
      { text: "허벅지는 굵은 편이지만 무릎 아래로 갈수록 가늘어져요", type: "S" },
      { text: "허벅지와 엉덩이에 살이 붙기 쉽고 전체적으로 둥근 느낌이에요", type: "W" },
      { text: "무릎 관절이 두드러지고 전체적으로 뼈대가 보이는 편이에요", type: "N" }
    ]
  },
  {
    q: "옷을 입었을 때 어떤 핏에서 가장 잘 어울린다는 말을 들으셨나요?",
    hint: "평소에 주변에서 받은 피드백을 떠올려 보세요.",
    opts: [
      { text: "몸에 딱 맞는 핏, 슬림하게 입었을 때 잘 어울린다는 말을 들어요", type: "S" },
      { text: "허리가 강조된 핏이나 상체에 볼륨이 있는 스타일이 잘 어울려요", type: "W" },
      { text: "여유있는 핏이나 오버사이즈를 입었을 때 자연스럽다는 말을 들어요", type: "N" }
    ]
  },
  {
    q: "피부 질감과 전체적인 인상이 어떤 편인가요?",
    hint: "첫인상을 기준으로 선택해 주세요.",
    opts: [
      { text: "탄탄하고 탄력 있어 보여요. 건강하고 활력 있는 인상이에요", type: "S" },
      { text: "부드럽고 섬세한 편이에요. 전체적으로 우아하고 세련된 인상이에요", type: "W" },
      { text: "뼈대가 강하고 존재감 있어 보여요. 시크하고 자연스러운 인상이에요", type: "N" }
    ]
  }
];

const types = {
  S: {
    badge: "스트레이트",
    title: "스트레이트 골격",
    desc: "근육 발달형으로 상체에 볼륨과 입체감이 있어요. 탄탄한 체형으로 슬림 핏 수트가 가장 잘 어울리는 골격이에요. 맞춤예복에서 핏만 제대로 잡으면 가장 완성도 높은 실루엣이 나오는 타입입니다.",
    features: [
      { label: "골격 특징", value: "근육 발달형, 상체 입체감" },
      { label: "어깨 라인", value: "넓고 각진 직각 어깨" },
      { label: "몸의 중심", value: "상체에 볼륨 집중" },
      { label: "피부 질감", value: "탄탄하고 탄력 있음" }
    ],
    suits: [
      "어깨를 자연스럽게 잡아주는 슬림 핏 수트",
      "가슴과 허리 라인이 살아있는 싱글 브레스트",
      "목선을 시원하게 열어주는 V존 셔츠",
      "네이비·차콜 등 다크 계열 원단으로 무게감 조절"
    ],
    warns: [
      "라펠이 너무 넓으면 상체가 과도하게 강조될 수 있어요",
      "두꺼운 패딩 소재는 상체를 더 크게 보이게 해요",
      "목선을 막는 디테일(버튼업 올리기 등)은 답답해 보일 수 있어요"
    ]
  },
  W: {
    badge: "웨이브",

let current = 0;
let answers = [];
const scores = { S: 0, W: 0, N: 0 };

function startQuiz() {
  document.getElementById('intro').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  renderQ();
}

function renderQ() {
  const q = questions[current];
  document.getElementById('qnum').textContent = `Question ${String(current+1).padStart(2,'0')} / ${questions.length}`;
  document.getElementById('qtext').textContent = q.q;
  document.getElementById('qhint').textContent = q.hint;
  document.getElementById('counter').textContent = `${current+1} / ${questions.length}`;
  document.getElementById('progress').style.width = `${(current / questions.length) * 100}%`;
  document.getElementById('back-btn').style.display = current === 0 ? 'none' : '';
  document.getElementById('next-btn').textContent = current === questions.length - 1 ? '결과 보기' : '다음';
  document.getElementById('next-btn').disabled = answers[current] === undefined;

  document.getElementById('opts').innerHTML = q.opts.map((o, i) => `
    <button class="opt ${answers[current] === i ? 'selected' : ''}" onclick="selectOpt(${i})">
      <span class="opt-key">${['A','B','C'][i]}</span>
      <span class="opt-text">${o.text}</span>
    </button>
  `).join('');

  const quiz = document.getElementById('quiz');
  quiz.style.animation = 'none';
  requestAnimationFrame(() => { quiz.style.animation = 'fadeUp 0.35s ease both'; });
}

function selectOpt(i) {
  answers[current] = i;
  document.querySelectorAll('.opt').forEach((b, idx) => {
    b.classList.toggle('selected', idx === i);
  });
  document.getElementById('next-btn').disabled = false;
}

function goNext() {
  if (answers[current] === undefined) return;
  current++;
  if (current >= questions.length) showResult();
  else renderQ();
}

function goBack() {
  if (current > 0) { current--; renderQ(); }
}

function showResult() {
  const sc = { S: 0, W: 0, N: 0 };
  answers.forEach((a, qi) => { sc[questions[qi].opts[a].type]++; });
  const top = Object.entries(sc).sort((a,b) => b[1]-a[1])[0][0];
  const t = types[top];

  document.getElementById('quiz').classList.add('hidden');
  document.getElementById('counter').textContent = '완료';
  document.getElementById('progress').style.width = '100%';

  const res = document.getElementById('result');
  res.classList.remove('hidden');
  res.innerHTML = `
    <div class="result-eyebrow">Diagnosis Result</div>
    <div class="result-badge">${t.badge} 타입</div>
    <h2 class="result-title">${t.title}</h2>
    <p class="result-desc">${t.desc}</p>
    <div class="result-divider"></div>

    <div class="section-label">골격 특성</div>
    <div class="feature-grid">
      ${t.features.map(f => `
        <div class="feature-card">
          <span class="feature-card-label">${f.label}</span>
          <span class="feature-card-value">${f.value}</span>
        </div>
      `).join('')}
    </div>

    <div class="section-label">예복 추천 스타일</div>
    <ul class="style-list">
      ${t.suits.map((s,i) => `
        <li class="style-item">
          <span class="style-num">0${i+1}</span>
          <span class="style-text">${s}</span>
        </li>
      `).join('')}
    </ul>

    <div class="warn-box">
      <div class="warn-label">피하면 좋은 스타일</div>
      ${t.warns.map(w => `
        <div class="warn-item">
          <span class="warn-dash">—</span>
          <span>${w}</span>
        </div>
      `).join('')}
    </div>

    <div class="cta-block">
      <div class="cta-title">골격에 맞는 예복, 직접 확인해보세요</div>
      <div class="cta-sub">진단 결과를 바탕으로 골격에 꼭 맞는 샘플을<br>미리 준비해드려요. 부담 없이 문의해 주세요.</div>
      <a class="cta-btn" href="http://pf.kakao.com/_BxcxcSj/chat" target="_blank">카카오톡 상담 문의하기</a>
    </div>

    <button class="btn-retry" onclick="restart()">다시 진단하기</button>

    <div class="footer-note">
      본 진단은 자가진단을 위한 참고용이에요.<br>
      더 정확한 진단은 디바인핸즈 전주점 방문 상담을 통해 받으실 수 있어요.
    </div>
  `;
}

function restart() {
  current = 0;
  answers = [];
  document.getElementById('result').classList.add('hidden');
  document.getElementById('counter').textContent = '1 / 7';
  document.getElementById('quiz').classList.remove('hidden');
  renderQ();
}
</script>
